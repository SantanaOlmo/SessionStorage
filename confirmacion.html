</head>

            <b>Nombre de usuario: </b><p id="nombreDeUsuario"></p>

        </div>
        <div class="linea">
            <b>Categoría: </b> <p id="categoria"></p>
        </div>
        <div class="linea">
            <b>Método de pago: </b><p id="metodoDePago"></p>
        </div>

    </section>
    <button id="btnVolver" class="btn" onclick="window.location.href='index.html'">Volver</button>

    <script src="js/script.js"></script>
